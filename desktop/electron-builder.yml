appId: com.surveyapp.desktop
productName: Survey App
copyright: Copyright © Survey App
directories:
  output: release
  buildResources: build
files:
  - main.js
  - preload.js
  - package.json
  - node_modules/**/*
extraResources:
  - from: ../backend
    to: backend
    filter:
      - "**/*"
      - "!.venv/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/*.pyo"
      - "!**/.pytest_cache/**"
  - from: python-runtime
    to: python-runtime
    filter:
      - "**/*"
win:
  sign: null
  target:
    - target: dir
      arch: x64
msi:
  oneClick: false
  perMachine: true
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Survey App
